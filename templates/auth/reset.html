{% extends 'auth/_shell.html' %}{% set title='Nueva contraseña' %}{% block form %}<span class="eyebrow">NUEVA CONTRASEÑA</span><h2>Protege tu cuenta</h2>{% if errors %}<div class="notice error"><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nueva contraseña<input type="password" name="password" autocomplete="new-password" required></label><button class="btn-primary" type="submit">Guardar contraseña</button></form>{% endblock %}
