{% extends 'auth/_shell.html' %}{% set title='Ingresar' %}{% block form %}<span class="eyebrow">CUENTA SEGURA</span><h2>Bienvenido de nuevo</h2><p>Ingresa para continuar con tus análisis.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Correo<input type="email" name="email" autocomplete="email" required></label><label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label><button class="btn-primary" type="submit">Ingresar</button></form><div class="auth-links"><a href="{{ url_for('auth.forgot_password') }}">Recuperar contraseña</a><a href="{{ url_for('auth.register') }}">Crear cuenta</a></div>{% endblock %}
